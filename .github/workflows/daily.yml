name: Daily fetch

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC every day
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every step below may fail without stopping the job, so the raw data is
      # always committed (the day still counts). The last step then fails the
      # run if anything went wrong, so it shows up red.
      - name: Fetch raw postings
        id: fetch
        continue-on-error: true
        run: python fetch.py

      - name: Build history.csv
        id: build
        continue-on-error: true
        run: python build.py

      - name: Write status.json
        id: status
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python status.py

      - name: Open or update the daily issue
        id: issue
        if: steps.status.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python issue.py

      - name: Commit and push data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data/raw data/history.csv data/status.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail the run if any step failed
        if: always()
        run: |
          echo "fetch=${{ steps.fetch.outcome }} build=${{ steps.build.outcome }} status=${{ steps.status.outcome }} issue=${{ steps.issue.outcome }}"
          if [ "${{ steps.fetch.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.status.outcome }}" != "success" ] || \
             [ "${{ steps.issue.outcome }}" != "success" ]; then
            echo "::error::One or more steps failed (see outcomes above). Raw data was still committed."
            exit 1
          fi
